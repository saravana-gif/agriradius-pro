name: keep-alive

# Pings the app's health endpoint so the Render free instance stays awake
# through India's active hours (~05:30-23:30 IST). It's allowed to sleep
# overnight so we stay within Render's free monthly run-time budget.
#   Schedule is in UTC. 00:00-17:59 UTC == 05:30-23:29 IST.
# GitHub's scheduler is best-effort and can run a few minutes late, so we
# ping every 5 minutes to leave margin against Render's 15-minute sleep
# timer. You can also run it manually from the Actions tab.

on:
  schedule:
    - cron: "*/5 0-17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: >
          curl -fsS --max-time 90 --retry 4 --retry-all-errors
          https://groundintel.oneroot.farm/_stcore/health || true
