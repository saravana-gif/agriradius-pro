# OneRoot AgriRadius Pro - app configuration.
# secrets.toml (API keys, service account) is separate and gitignored.

[theme]
primaryColor = "#16A34A"
backgroundColor = "#F5F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
maxUploadSize = 50
enableStaticServing = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "stacktrace"
toolbarMode = "minimal"
