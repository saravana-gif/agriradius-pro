# Farmer-facing advice text for the share kit (card, WhatsApp text,
# 45-second voice script), one table per rule id in rules/rules.toml.
#
# SIGN-OFF. Each language block has its own approved_by / approved_on.
# A share button appears only when BOTH the rule (rules/rules.toml) and
# this language block are signed. Until then staff see a DRAFT card
# that says "do not share". The Kannada and Tamil below were written
# without a native-speaker agronomist: have one read every line, fix
# it, then put their name in approved_by.
#
# Slots: {village} {season_label} {season_start_label} {season_cum_mm}
# {season_normal_mm} {season_dep_pct} {season_category_label}
# {dry_days} {fc_rain_3d_mm} {fc_max_rain_3d_mm} {fc_rain_7d_mm}
# {fc_rainy_days_7d} {fc_dry_run_days} {fc_tmax_mean_7d}
# {fc_blotch_days_7d} - filled from the alert's stored features.
#
# Every text must: say conditions favour (kn: ಅನುಕೂಲ, ta: சாதகம்);
# for pests/diseases say scout before spraying (kn: ಸಿಂಪಡಿಸುವ ಮೊದಲು,
# ta: தெளிப்பதற்கு முன்); give odds, not certainty; name no brand,
# product or price. The source is added to every card automatically.
# Voice scripts should read in about 45 seconds (checked by tests).

